[project]
name = "DuNaiBot"
version = "0.1.0"
description = "DuNaiBot"
readme = "README.md"
requires-python = ">=3.8, <4.0"

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
plugins = ["nonebot_plugin_tortoise_orm"]
plugin_dirs = ["src/plugins"]
builtin_plugins = []
